<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>夜遇吧入口</title>
  <meta name="description" content="夜遇吧入口">
  <link rel="icon" href="/favicon.ico">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 15px;
      min-width: 280px;
      min-height: 100vh;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.8;
      color: #333;
      background: #f5f7fa;
      overflow-wrap: anywhere;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 20px auto;
    }

    .header {
      padding: 22px 18px;
      background: #fff;
      border: 1px solid #e8edf3;
      border-radius: 8px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.5;
      color: #1677d2;
    }

    .header p {
      margin: 8px 0 0;
      color: #777;
      font-size: 13px;
    }

    .card {
      margin-top: 14px;
      padding: 18px;
      background: #fff;
      border: 1px solid #e8edf3;
      border-radius: 8px;
    }

    .card h2 {
      margin: 0 0 12px;
      padding-left: 10px;
      border-left: 3px solid #1677d2;
      font-size: 17px;
      line-height: 1.5;
    }

    .notice {
      margin: 0;
      padding: 10px 12px;
      color: #555;
      background: #f5f8fc;
      border-radius: 5px;
      font-size: 14px;
    }

    .link {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #e5eaf0;
      border-radius: 5px;
      color: #1677d2;
      background: #fff;
      text-decoration: none;
      overflow-wrap: anywhere;
      word-break: break-word;
      transition: background .2s;
    }

    .link:hover {
      background: #f5f9ff;
    }

    .link:focus-visible {
      outline: 2px solid #1677d2;
      outline-offset: 2px;
    }

    .tip {
      margin: 10px 0 0;
      color: #888;
      font-size: 13px;
    }

    .footer {
      padding: 20px 5px;
      text-align: center;
      color: #999;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
        font-size: 14px;
      }

      .container {
        margin: 8px auto;
      }

      .header {
        padding: 18px 14px;
      }

      .header h1 {
        font-size: 20px;
      }

      .card {
        padding: 14px;
        margin-top: 10px;
      }

      .card h2 {
        font-size: 16px;
      }

      .link {
        padding: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>夜遇吧入口</h1>
    </header>

    <section class="card">
      <h2>网站公告</h2>
      <p class="notice">本页面实时更新 夜遇吧 最新地址</p>
    </section>

    <section class="card">
      <h2>最新地址</h2>

      <a class="link"
         href="https://yeyu98.top"
         target="_blank"
         rel="noopener noreferrer">https://yeyu98.top</a>
    </section>

    <section class="card">
      <h2>海外永久地址</h2>

      <a class="link"
         href="https://yeyubar.com"
         target="_blank"
         rel="noopener noreferrer">https://yeyubar.com</a>
    </section>

    <section class="card">
      <h2>温馨提示</h2>
      <p class="notice">请收藏本页面，后续访问 夜遇吧 可获取最新地址</p>
    </section>

    <footer class="footer">
      Copyright © 2026 夜遇吧入口
    </footer>

  </main>
</body>
</html>
